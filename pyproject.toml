[project]
name = "ableton-connect"
version = "0.1.0"
description = "Authenticated HTTP bridge from a remote MCP client to local Ableton Live"
readme = "README.md"
license = "MIT"
authors = [
    { name = "fitworks.io" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.16",
    "uvicorn>=0.54.0",
]

[project.scripts]
ableton-connect = "ableton_connect:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
